services:
  bot:
    build: .
    image: whatsapp-booking-bot:1.0.0
    container_name: booking-bot

    # Контейнер поднимается сам: после падения, после перезагрузки сервера,
    # после отключения питания. Вмешательство человека не требуется.
    restart: always

    env_file:
      - .env

    ports:
      # Наружу торчит только localhost. Доступ из интернета даёт nginx/Caddy,
      # который держит HTTPS-сертификат (см. README, раздел 6).
      - "127.0.0.1:8080:8080"

    volumes:
      # Состояние диалогов и журнал сообщений. Переживает пересборку образа.
      - ./data:/app/data
      # Логи приложения — читаются с сервера обычным текстовым редактором.
      - ./logs:/app/logs
      # JSON-ключ Google, только на чтение.
      - ./secrets:/app/secrets:ro

    logging:
      driver: json-file
      options:
        # Вторая линия защиты от переполнения диска: логи самого Docker
        # тоже ограничены. Без этого журнал контейнера растёт бесконечно
        # и однажды забивает диск целиком.
        max-size: "10m"
        max-file: "5"

    # Ограничение памяти: утечка в зависимости не должна утянуть за собой
    # весь сервер — контейнер перезапустится сам.
    deploy:
      resources:
        limits:
          memory: 512M
